<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Catálogo Interactivo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .producto { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; width: 200px; }
        .carrito { position: fixed; top: 10px; right: 10px; background: #f0f0f0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Catálogo de Productos</h1>
    <div class="producto">
        <h3>Producto 1</h3>
        <p>Descripción del producto 1.</p>
        <p>Precio: $10.00</p>
        <button onclick="agregarAlCarrito('Producto 1')">Agregar al Carrito</button>
    </div>
    <div class="producto">
        <h3>Producto 2</h3>
        <p>Descripción del producto 2.</p>
        <p>Precio: $20.00</p>
        <button onclick="agregarAlCarrito('Producto 2')">Agregar al Carrito</button>
    </div>
    <div class="carrito">
        <h4>Carrito de Compras</h4>
        <ul id="lista-carrito"></ul>
        <p>Total: $<span id="total">0.00</span></p>
    </div>
    <script>
        let carrito = [];
        let total = 0;

        function agregarAlCarrito(producto) {
            carrito.push(producto);
            total += 10; // Simulación de precio
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = '';
            carrito.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                lista.appendChild(li);
            });
            document.getElementById('total').textContent = total.toFixed(2);
        }
    </script>
</body>
</html></content>
